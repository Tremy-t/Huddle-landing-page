<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="main.css">
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>
<body>
  <main>
      <div class="header">
         <img class="logo" src="./images/logo.svg" alt="huddle-logo">
      </div>

      <section>
        <div class="main">
          <div class="left-side">
            <img class="left-image" src="./images/illustration-mockups.svg" alt="">
          </div>

          <div class="right-side">
            <h1>Build The Community Your Fans Will Love</h1>
            <p>Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
              Create connections with your users as you engage in genuine discussion. </p>

              <div class="btn">
                <button class="bttn">Register</button>
              </div>

          </div>
        </div>

        <div class="socials">
        <a href=""> <img src="./images/social media icons 6.png" class="icon" alt="facebook"></a> 
          <a href="https://www.x.com/@RyoDabi/"> <img src="./images/social media icons 3.png" class="icon" alt="X(Twitter)"></a>
        <a href="https://www.instagram.com/_.thekrawler._/"><img src="./images/social media icons 33.png" class="icon" alt="instagram"></a> 
        </div>
      </section>
    </main>
  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Ransford A.A Osei</a>.
    </p>
  </footer>
</body>
</html>
